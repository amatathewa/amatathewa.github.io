<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="color-scheme" content="dark only">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>สับไพ่ · AMATATHEWA</title>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;1,6..96,400&family=IBM+Plex+Sans+Thai:wght@300;400;500&family=Jost:wght@400;500&family=Trirong:wght@200;300;400&display=swap" rel="stylesheet">
<style>
/* ทุกหน้า: (ไม่ใช้ view transition — บางเบราว์เซอร์มือถือวางภาพเยื้อง) · ไม่มีแสงฟ้าตอนแตะ (มือถือ) · ไม่มีแท่งเลื่อนด้านขวา */
*{-webkit-tap-highlight-color:transparent}
html{scrollbar-width:none}html::-webkit-scrollbar,body::-webkit-scrollbar{display:none}
</style>
<style>
:root{color-scheme:dark only}
:root{--gold:#C99B3C;--gold-light:#E8C987;--ivory:#F3EDE2;--dim:rgba(243,237,226,.62);--line:rgba(243,237,226,.16);--cw:min(150px,19vh)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#05070E;color:var(--ivory);font-family:'IBM Plex Sans Thai',sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden;user-select:none}
.stage{position:relative;height:100vh;height:100svh;overflow:hidden;display:flex;flex-direction:column}
.bg{position:absolute;inset:0;background:#05070E center/cover no-repeat}
/* แบบ A: ซุ้มประตูเดิม เบลอและมืดลง เหมือนเดินผ่านประตูเข้ามาแล้ว */
.arch .bg{background-image:url("../ภาพพื้นหลัง/arch-desktop-blur.jpg");transform:scale(1.06)} /* เบลอไว้ในไฟล์ภาพแล้ว ไม่ให้เครื่องคำนวณเบลอสด */
/* แบบ B: ผิวน้ำสะท้อนจันทร์ */
.ocean .bg{background-image:url("../ภาพพื้นหลัง/ocean-desktop.jpg");background-position:center 40%}
.ocean .veil{position:absolute;inset:0;background:radial-gradient(ellipse 50% 45% at 50% 52%,rgba(5,7,14,.55),transparent 80%)}
header{position:relative;z-index:2;flex:none;display:flex;justify-content:space-between;align-items:center;padding:min(30px,3.4vh) 6vw}
.brand{font-family:'Jost',sans-serif;letter-spacing:.42em;font-size:13px}
.back{font-size:14px;color:var(--dim);cursor:pointer;letter-spacing:.04em;border-bottom:1px solid transparent;transition:color .3s,border-color .3s}
.back:hover{color:var(--ivory);border-color:var(--gold)}
main{position:relative;z-index:2;flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 24px 6vh}
.kicker{font-family:'Jost',sans-serif;font-size:16px;letter-spacing:.42em;color:var(--gold);margin-bottom:min(18px,2vh)}
h1{font-family:'Trirong',serif;font-weight:200;font-size:clamp(30px,5vh,48px);line-height:1.25;white-space:nowrap}
h1 em{font-style:normal;color:var(--gold-light)}
.lead{margin:min(10px,1.2vh) 0 min(34px,4vh);font-size:15px;color:var(--dim);font-weight:300}
/* สำรับ */
.deck{position:relative;width:var(--cw);aspect-ratio:600/995;cursor:pointer;margin-bottom:min(26px,3vh)}
.deck .c{position:absolute;inset:0;will-change:transform;border-radius:calc(var(--cw)*.055);background:var(--back,url("https://raw.githubusercontent.com/amatathewa/tarot-collections/main/rider-waite-1909/back.webp")) center/cover;box-shadow:0 0 0 1px rgba(0,0,0,.35)}
/* เงาใต้สำรับอยู่นิ่ง ไพ่ 3 ใบสลับลำดับกันจริงตอนสับ (ขยับด้วย JS) */
.deck .sd{position:absolute;inset:0;border-radius:calc(var(--cw)*.055);box-shadow:0 22px 50px rgba(0,0,0,.6);transform:translate(-3px,4px) rotate(-2deg)}
.deck .halo{position:absolute;left:50%;bottom:-18px;width:160%;height:40px;transform:translateX(-50%);background:radial-gradient(ellipse,rgba(150,175,215,.22),transparent 70%);filter:blur(6px)}
.count{font-family:'Bodoni Moda',serif;font-style:italic;font-size:22px;color:var(--gold);height:30px}
.count small{font-family:'IBM Plex Sans Thai';font-style:normal;font-size:13px;color:var(--dim);margin-left:8px}
.hint{font-size:13.5px;color:var(--dim);margin:2px 0 min(26px,3vh)}
.btns{display:flex;gap:16px}
.btn{background:rgba(243,237,226,.08);backdrop-filter:blur(14px) saturate(1.2);-webkit-backdrop-filter:blur(14px) saturate(1.2);border:1px solid rgba(243,237,226,.28);color:var(--ivory);font-size:15px;letter-spacing:.04em;padding:15px 0;width:min(190px,40vw);cursor:pointer;transition:background .3s,opacity .3s}
.btn:hover{background:rgba(243,237,226,.16)}
.btn.off{opacity:.35;pointer-events:none}
.btn small{display:block;font-size:11.5px;color:var(--dim);margin-top:3px;letter-spacing:0}
.leave .kicker,.leave h1,.leave .lead,.leave .hint,.leave .btns,.leave .count,.leave .next,.leave .halo{opacity:0!important;transition:opacity .4s}
@media(max-width:700px){
  :root{--cw:min(120px,17vh)}
  header{padding:18px 20px}
  h1{font-size:min(7vw,32px)}
  .lead{font-size:13.5px}
  .btns{width:100%;gap:10px}.btn{flex:1;width:auto}
}
</style></head><body>
<div class="stage">
  <div class="bg"></div><div class="veil"></div>
  <header><div class="brand">AMATATHEWA</div><div class="back" onclick="go('spread.html')">ย้อนกลับ</div></header>
  <main>
    <div class="kicker">SHUFFLE</div>
    <h1>สับไพ่ <em>ตามจังหวะของใจ</em></h1>
    <p class="lead">นึกถึงคำถามไว้ในใจ แล้วสับจนกว่าจะรู้สึกว่าพอ</p>
    <div class="deck" id="deck"><div class="halo"></div><div class="sd"></div><div class="c c1"></div><div class="c c2"></div><div class="c c3"></div></div>
    <div class="count" id="cnt"></div>
    <div class="hint">แตะสำรับเพื่อสับ · กดค้างไว้เพื่อสับต่อเนื่อง</div>
    <div class="btns"><div class="btn off" id="b1">ตัดไพ่<small>แบ่ง 3 กอง แล้วเรียงใหม่</small></div><div class="btn off" id="b2">กรีดไพ่<small>เลือกไพ่ทันที</small></div></div>
  </main>
</div>
<script src="flow.js?v=202610280841"></script>
<script>
if(IN_SHELL)parent.postMessage({preload:['pick.html?'+new URLSearchParams(ST),'cut.html?'+new URLSearchParams(ST)]},location.origin); // โหลดฉากกรีดไพ่+ตัดไพ่เตรียมไว้ กดแล้วไปต่อได้ทันที

document.body.className='arch';
const d=document.getElementById('deck'),c=document.getElementById('cnt');let n=0,busy=false,hold=false,queued=0,t1;
// ท่าพักของไพ่ ล่าง·กลาง·หน้า และท่าแยกกลางจังหวะ
const P=['translate3d(-3px,4px,0) rotate(-2deg)','translate3d(2px,2px,0) rotate(1.5deg)','translate3d(0,0,0) rotate(0deg)'];
const OUT=['translate3d(-3px,-6px,0) rotate(-1deg)','translate3d(74px,-12px,0) rotate(9deg)','translate3d(-78px,-16px,0) rotate(-10deg)'];
let cards=[...d.querySelectorAll('.c')];cards.forEach((e,i)=>{e.style.transform=P[i];e.style.zIndex=i+1});
function sh(){
  if(busy){if(queued<2)queued++;return}
  busy=true;n++;c.innerHTML=n+'<small>ครั้ง</small>';document.querySelectorAll('.btn').forEach(b=>b.classList.remove('off'));
  const dur=hold?350:405,ease='cubic-bezier(.45,0,.25,1)',[bot,mid,front]=cards;
  /* ใบหน้าแยกซ้ายแล้วมุดลงล่าง · ใบกลางแยกขวาแล้วขึ้นเป็นใบหน้า · ใบล่างขยับขึ้นเป็นใบกลาง */
  const go=(e,from,to,k)=>e.animate([{transform:P[from]},{transform:OUT[k],offset:.45},{transform:P[to]}],{duration:dur,easing:ease});
  go(bot,0,1,0);go(mid,1,2,1);go(front,2,0,2);
  setTimeout(()=>{front.style.zIndex=0},dur*.5);
  cards=[front,bot,mid];cards.forEach((e,i)=>e.style.transform=P[i]);
  setTimeout(()=>{cards.forEach((e,i)=>e.style.zIndex=i+1);busy=false;
    if(hold||queued){if(queued)queued--;sh()}},dur+10);
}
const st=e=>{e.preventDefault();sh();t1=setTimeout(()=>{hold=true;if(!busy)sh()},220)},en=()=>{clearTimeout(t1);hold=false};
d.addEventListener('mousedown',st);d.addEventListener('touchstart',st,{passive:false});['mouseup','mouseleave','touchend','touchcancel'].forEach(x=>d.addEventListener(x,en));
document.getElementById('b1').onclick=()=>{document.body.classList.add('leave');go('cut.html')};
// กรีดไพ่: ตัวหนังสือจางออก เหลือสำรับกลางจอ แล้วหน้าเลือกไพ่กรีดต่อจากกองนี้
document.getElementById('b2').onclick=()=>{document.body.classList.add('leave');const dk=document.getElementById('deck');go('pick.html',{},[dk,dk])};
</script>
</body></html>
