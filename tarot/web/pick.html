<!doctype html>
<html lang="th"><head><meta charset="utf-8"><script>/* เปิดในกรอบ (index.html): รอกรอบสั่ง "show" (ฉากนี้ขึ้นจอแล้ว) ก่อนเริ่มแอนิเมชัน · เปิดหน้านี้ตรงๆ: เริ่มเลย */
window.__inShell=parent!==window;window.__shown=!window.__inShell;window.__showCbs=[];
addEventListener('message',e=>{if(e.data==='show'&&!window.__shown){window.__shown=true;window.__showCbs.splice(0).forEach(f=>f())}});
function onShow(cb,ms){let done=false;const go=()=>{if(!done){done=true;cb()}};if(window.__shown)go();else{window.__showCbs.push(go);if(ms&&!window.__inShell)setTimeout(go,ms)}} // ในกรอบไม่ใช้ตัวสำรองนับเวลา: ฉากที่โหลดเตรียมไว้นานๆ จะเผลอเล่นแอนิเมชันไปก่อนขึ้นจอ
</script>

<meta name="color-scheme" content="dark only">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>เลือกไพ่ · AMATATHEWA</title>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;1,6..96,400&family=IBM+Plex+Sans+Thai:wght@300;400;500&family=Jost:wght@400;500&family=Trirong:wght@200;300;400&display=swap" rel="stylesheet">
<style>
/* ทุกหน้า: (ไม่ใช้ view transition — บางเบราว์เซอร์มือถือวางภาพเยื้อง) · ไม่มีแสงฟ้าตอนแตะ (มือถือ) · ไม่มีแท่งเลื่อนด้านขวา */
*{-webkit-tap-highlight-color:transparent}
html{scrollbar-width:none}html::-webkit-scrollbar,body::-webkit-scrollbar{display:none}
</style>
<style>
:root{color-scheme:dark only;--gold:#C99B3C;--gold-light:#E8C987;--ivory:#F3EDE2;--dim:rgba(243,237,226,.62)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#05070E;color:var(--ivory);font-family:'IBM Plex Sans Thai',sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden;user-select:none}
.stage{position:relative;height:100vh;height:100svh;overflow:hidden;display:flex;flex-direction:column}
/* ฉากหลัง = ไพ่สำรับที่เลือกวางบนหินอ่อน (เปลี่ยนตามสำรับ) */
/* ฉากหินอ่อนเต็มจอจริง (fixed) ให้ขนาดเท่าฉากหินอ่อนต้นหน้าผลไพ่เป๊ะ ไม่กระตุก ไม่มีขอบดำ */
.bg{position:fixed;inset:0;background:#05070E center 80%/cover no-repeat}
.veil{position:fixed;inset:0;background:linear-gradient(180deg,rgba(5,7,14,.6) 0%,rgba(5,7,14,.3) 50%,rgba(5,7,14,.45) 100%)}
header{position:relative;z-index:3;flex:none;display:flex;justify-content:space-between;align-items:center;padding:min(30px,3.4vh) 6vw}
.brand{font-family:'Jost',sans-serif;letter-spacing:.42em;font-size:13px}
.back{font-size:14px;color:var(--dim);cursor:pointer}
main{position:relative;z-index:2;flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;text-align:center;padding:0 0 4vh}
.kicker{font-family:'Jost',sans-serif;font-size:16px;letter-spacing:.42em;color:var(--gold);margin-bottom:min(14px,1.6vh)}
h1{font-family:'Trirong',serif;font-weight:200;font-size:clamp(28px,4.6vh,44px);line-height:1.25;white-space:nowrap}
h1 em{font-style:normal;color:var(--gold-light)}
.fan{position:relative;flex:1;min-height:0;width:100%;margin:min(10px,1.2vh) 0;overflow-y:auto;overflow-x:hidden;padding:24px 0 6px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.fan::-webkit-scrollbar{display:none}
.fc{position:absolute;border-radius:7%/4.2%;background:center/cover;box-shadow:-2px 3px 8px rgba(0,0,0,.45);transform-origin:bottom center;cursor:pointer;transition:transform .25s ease,filter .25s,opacity .4s;will-change:transform}
.fc:hover:not(.sel):not(.dim){filter:brightness(1.18)}
.fc.sel{box-shadow:0 0 0 1.5px var(--gold),0 0 22px rgba(201,155,60,.55)}
.fc.dim{filter:brightness(.55);pointer-events:none}
.bar{display:flex;flex-direction:column;align-items:center;gap:min(12px,1.4vh)}
.cnt{font-size:14px;color:var(--dim)}
.cnt b{font-family:'Bodoni Moda',serif;font-style:italic;font-weight:400;font-size:22px;color:var(--gold);margin:0 4px}
.btn{background:rgba(243,237,226,.08);backdrop-filter:blur(14px) saturate(1.2);-webkit-backdrop-filter:blur(14px) saturate(1.2);border:1px solid rgba(243,237,226,.28);color:var(--ivory);font-size:15px;letter-spacing:.04em;padding:15px 0;width:min(240px,70vw);cursor:pointer;transition:background .3s,opacity .3s}
.btn.off{opacity:.35;pointer-events:none}
.btn:hover{background:rgba(243,237,226,.16)}
.switch{position:absolute;z-index:3;left:6vw;bottom:3vh;font-size:12.5px;color:var(--dim);cursor:pointer;border-bottom:1px solid rgba(243,237,226,.25)}
.bgin{position:absolute;inset:0;background:#05070E url("../ภาพพื้นหลัง/arch-desktop-blur.jpg") center/cover no-repeat;transform:scale(1.06)}
.bgin.out{animation:bgout 1.6s cubic-bezier(.45,0,.3,1) forwards}
@keyframes bgout{to{opacity:0}}
.fadein{animation:fin .8s ease both}
@keyframes fin{from{opacity:0}}
.leave .kicker,.leave h1,.leave .bar,.leave header,.leave .fc:not(.sel){opacity:0!important;transition:opacity .45s}
.leave2 .kicker,.leave2 h1,.leave2 .bar,.leave2 header .back,.leave2 .fc:not(.sel){opacity:0!important;transition:opacity .28s}
.wait .fc{opacity:0}
.pile0{position:absolute;border-radius:7%/4.2%;background:center/cover;box-shadow:0 14px 30px rgba(0,0,0,.55);transform-origin:bottom center}
@media(max-width:700px){header{padding:18px 20px}h1{font-size:min(7vw,30px)}.switch{left:20px;bottom:1.6vh}}
</style></head><body>
<div class="stage">
  <div class="bg" id="bg"></div><div class="veil"></div><div class="bgin" id="bgin"></div>
  <header><div class="brand">AMATATHEWA</div><div class="back" onclick="go('shuffle.html')">ย้อนกลับ</div></header>
  <main>
    <div class="kicker fadein">CHOOSE YOUR CARDS</div>
    <h1 class="fadein">เลือกไพ่ <em>ที่ดึงดูดคุณ</em></h1>
    <div class="fan wait" id="fan"></div>
    <div class="bar fadein"><div class="cnt">เลือกแล้ว<b id="n">0</b>/ <span id="need">3</span> ใบ</div><div class="btn off" id="go">เปิดไพ่</div></div>
  </main>
</div>
<script src="flow.js?v=202610280928"></script>
<script>
const NEED=SPREADS[ST.sp].length;
document.getElementById('bg').style.backgroundImage=`url("${D.marble}")`;
document.getElementById('need').textContent=NEED;
// สำรับที่สับแล้ว: ทุกครั้งที่เข้าหน้านี้เรียงไพ่ใหม่แบบสุ่มจริง (ชุดใหญ่ = 22 ใบ id 1–22)
const ids=Array.from({length:ST.major==='1'?22:78},(_,i)=>i+1);
for(let i=ids.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[ids[i],ids[j]]=[ids[j],ids[i]]}
const revs=ids.map(()=>ST.rev==='1'&&Math.random()<.5),N=ids.length;
const fan=document.getElementById('fan');let sel=[];
function build(){
  // วางไพ่แบบเว็บเดิม (TarotReading4): 6 แถวซ้อนกัน แต่ละแถวโค้งเล็กน้อย ไพ่ใหญ่ เลือกง่าย (ชุดใหญ่ 3 แถว)
  fan.innerHTML='';const W=fan.clientWidth,ROWS=N>30?6:3,per=Math.ceil(N/ROWS);
  const PAD_H=W<700?14:42,fanH=Math.max(120,fan.clientHeight-30-30)/* หักขอบบนล่างของกล่อง + ที่ยกไพ่ ไม่ให้แถวสุดท้ายล้นขอบล่าง */,availW=W-PAD_H*2;
  const rowH=Math.max(70,Math.floor(fanH/3));
  const ch=Math.max(44,Math.floor((rowH-14)/1.10)),cw=Math.floor(ch*600/995);
  const tilt=Math.ceil(ch*Math.sin(12*Math.PI/180)*.75),useW=availW-tilt*2; // เผื่อไพ่ปลายแถวที่เอียง ไม่ให้ล้นขอบ
  const maxStep=Math.floor((useW-cw)/Math.max(per-1,1)),step=Math.min(Math.round(cw*.52),Math.max(maxStep,6));
  const maxLift=Math.round(ch*.10),maxAng=12;
  for(let r=0;r<ROWS;r++){
    const start=r*per,cnt=Math.min(per,N-start);if(cnt<=0)break;
    const row=document.createElement('div');
    row.style.cssText=`position:relative;width:100%;height:${rowH}px;flex-shrink:0;margin-top:${r?-Math.round(rowH*.6):0}px;z-index:${r+1}`;
    fan.appendChild(row);
    const x0=Math.round(W/2-(cw+(cnt-1)*step)/2),half=(cnt-1)/2;
    for(let j=0;j<cnt;j++){
      const i=start+j,t=half>0?(j-half)/half:0,ang=Math.abs(maxAng*t)<.4?.4:maxAng*t,lift=Math.round(maxLift*t*t);
      const e=document.createElement('div');e.className='fc';
      e.style.cssText=`width:${cw}px;height:${ch}px;left:${x0+j*step}px;top:${rowH-ch-maxLift+lift}px;background-image:url("${D.back}");transform:rotate(${ang}deg);z-index:${cnt-j}`;
      e.dataset.a=ang;if(sel.includes(i))e.classList.add('sel');
      // แตะเลือกบนมือถือ: เลื่อนนิ้วเกิน 14px = เลื่อนดู ไม่นับเป็นเลือก
      let x,y,moved=false;
      e.addEventListener('touchstart',ev=>{x=ev.touches[0].clientX;y=ev.touches[0].clientY;moved=false},{passive:true});
      e.addEventListener('touchmove',ev=>{if(Math.hypot(ev.touches[0].clientX-x,ev.touches[0].clientY-y)>14)moved=true},{passive:true});
      e.addEventListener('touchend',ev=>{ev.preventDefault();if(!moved)pick(e,i)});
      e.addEventListener('click',()=>pick(e,i));
      row.appendChild(e);
    }
  }
  upd();
  // ยังไม่กรีด: วางกองไพ่ไว้ที่ไพ่ใบแรกของแถวแรก (สำรับจากฉากก่อนเลื่อนมาวางตรงนี้พอดี)
  if(!dealt){const c=fan.firstChild.firstChild,p=document.createElement('div');p.className='pile0';p.style.cssText=c.style.cssText;p.style.zIndex=99;fan.firstChild.appendChild(p)}
  if(!dealt&&ready)deal();
}
addEventListener('message',e=>{if(e.origin===location.origin&&e.data==='getRect'){if(!fan.children.length)build();parent.postMessage({rect:window.SHELL_RECT()},location.origin)}});
window.SHELL_RECT=()=>{const c=fan.firstChild&&fan.firstChild.querySelector('.fc');if(!c)return null;const r=c.getBoundingClientRect();return{x:r.left+r.width/2,y:r.top+r.height/2,w:c.offsetWidth,h:c.offsetHeight,a:+c.dataset.a}};
let dealt=false,ready=false;
function startDeal(){if(ready)return;ready=true;if(fan.children.length&&!dealt)deal()}
// ฉากนี้ขึ้นจอแล้วค่อยกรีด (สำรอง 5 วิ ไพ่จะไม่ค้างซ่อน)
onShow(startDeal,5000);
// กรีดไพ่เหมือนมือจริง ทีละแถว: กองไพ่วางที่ซ้ายสุด → มือไถกองไปทางขวาด้วยความเร็วคงที่ ไพ่หลุดจากกองทีละใบ
// กองวิ่งตามแนวโค้งของพัด และไพ่ทุกใบที่ยังอยู่ในกองมีท่าเดียวกันเสมอ (กองแน่น ไม่บาน) — ณัทกรเลือกแบบนี้จากหน้าทดลอง 28 ต.ค.
// ซ้อนแบบเดิม ใบซ้ายทับใบขวา · แถวถัดไปขึ้นล่วงหน้าตอนแถวก่อนเหลือ 0.2 วิ (เคยลองให้ขึ้นเร็วกว่านี้แล้ว "ดูล้น")
function deal(){
  dealt=true;fan.style.pointerEvents='none';fan.classList.remove('wait');fan.querySelectorAll('.pile0').forEach(p=>p.remove());
  const M=160,S=26,LEAD=200;let end=0,T=120;
  [...fan.children].forEach((row,r)=>{
    const cs=[...row.querySelectorAll('.fc')],o0=r?0:1; // แถวแรกเริ่มจากกองที่เห็นอยู่แล้ว (ไม่จางเข้า)
    if(r)T=end-LEAD;
    cs.forEach((e,j)=>{
      const dur=M+j*S;end=Math.max(end,T+dur);
      // ท่าของกองตอนอยู่ที่ตำแหน่งใบที่ k (เทียบจากที่ของใบ e)
      const pose=k=>`translate(${cs[k].offsetLeft-e.offsetLeft}px,${cs[k].offsetTop-e.offsetTop}px) rotate(${cs[k].dataset.a}deg)`;
      let kf=[{opacity:o0},{opacity:1}];
      if(j){kf=[{transform:pose(0),opacity:o0},{transform:pose(0),opacity:1,offset:M/dur}];
        for(let k=1;k<=j;k++)kf.push({transform:k===j?`rotate(${e.dataset.a}deg)`:pose(k),opacity:1,offset:(M+k*S)/dur})}
      e.animate(kf,{duration:dur,delay:T,fill:'backwards'});
    });
  });
  setTimeout(()=>{fan.style.pointerEvents=''},end);
}

// ฉากซุ้มประตูเบลอจางเป็นหินอ่อน — รอภาพหินอ่อนพร้อมก่อน ไม่ให้กระพริบ · โหลดภาพท้องฟ้าหน้าผลไว้ล่วงหน้า
const mb=new Image();mb.src=D.marble;
// จางด้วย CSS animation (transition/animate() ของชั้นนี้ค้างที่จุดเริ่ม) + ครบเวลาแล้วลบชั้นทิ้งเสมอ ไม่ให้ฉากซุ้มประตูค้างทับ
const bgin=document.getElementById('bgin');let bginGone=false;
const fadeBgin=()=>{if(bginGone)return;bginGone=true;bgin.classList.add('out');setTimeout(()=>bgin.remove(),1700)};
const mbReady=Promise.race([(mb.decode?mb.decode():Promise.resolve()).catch(()=>{}),new Promise(r=>setTimeout(r,800))]);
onShow(()=>mbReady.then(()=>setTimeout(fadeBgin,150)),5000); // เริ่มจางหลังฉากนี้ขึ้นจอแล้วเท่านั้น
new Image().src=`../ภาพพื้นหลัง/dawn-${innerWidth<700?'mobile':'desktop'}.jpg`;
function pick(e,i){
  const a=e.dataset.a;
  if(sel.includes(i)){sel=sel.filter(x=>x!==i);e.classList.remove('sel');e.style.transform=`rotate(${a}deg)`}
  else if(sel.length<NEED){sel.push(i);e.classList.add('sel');e.style.transform=`rotate(${a}deg) translateY(-${mobUp()}px)`}
  upd();
}
const mobUp=()=>18;
function upd(){
  document.getElementById('n').textContent=sel.length;const full=sel.length>=NEED;
  document.querySelectorAll('.fc').forEach((e,k)=>e.classList.toggle('dim',full&&!e.classList.contains('sel')));
  document.getElementById('go').classList.toggle('off',!full);
  document.querySelectorAll('.fc.sel').forEach(e=>e.style.transform=`rotate(${e.dataset.a}deg) translateY(-${mobUp()}px)`);
}
addEventListener('resize',build);setTimeout(build,0); // ไม่ใช้ requestAnimationFrame: ฉากที่โหลดเตรียมไว้ข้างหลังมือถือไม่วาดเฟรมให้ ไพ่จะไม่ถูกจัด
document.getElementById('go').onclick=()=>{
  const fc=[...document.querySelectorAll('.fc')];
  // ใบอื่น หัวข้อ ปุ่ม จางหาย เหลือไพ่ที่เลือกบนหินอ่อน → หน้าผลรับตำแหน่งไปลอยเข้าช่องต่อ
  document.body.classList.add('leave2');document.getElementById('go').style.pointerEvents='none';
  const fly=sel.map(i=>{const e=fc[i],r=e.getBoundingClientRect();return{x:r.left+r.width/2,y:r.top+r.height/2,w:e.offsetWidth,h:e.offsetHeight,a:+e.dataset.a}});
  try{sessionStorage.setItem('tarot-fly',JSON.stringify(fly))}catch(e){}
  const c=sel.map(i=>ids[i]+(revs[i]?'r':'')).join('.');
  if(IN_SHELL)go('result.html',{c},{cards:sel.map(i=>fc[i])});else setTimeout(()=>go('result.html',{c}),300);
};
</script>
</body></html>
