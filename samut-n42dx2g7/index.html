:root{
  --night:#1F1029;--night-2:#341C42;--night-3:#0A0510;
  --gold:#C99B3C;--gold-d:#94701F;--gold-l:#F1DFA8;
  --cream:#FAF7F2;--card:#FFFFFF;--line:#E9E1D5;--field:#FCFAF6;
  --ink:#24162E;--muted:#7C6E86;
  --blue:#2F64C2;--orange:#C9641C;
  --mono:Consolas,"Cascadia Mono","Courier New",monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--cream);color:var(--ink);font-family:Plex,sans-serif;font-size:17px;line-height:1.5}
button{font-family:Plex,sans-serif;cursor:pointer}

/* แถบหัว */
.top{background:radial-gradient(120% 140% at 15% 0%,var(--night-2),var(--night) 55%,var(--night-3));color:#fff}
.top .in{max-width:980px;margin:0 auto;padding:28px 20px 26px;display:flex;align-items:center;gap:18px}
.top img{width:58px;height:58px}
.top h1{margin:0;font-family:Tri;font-weight:normal;font-size:30px;letter-spacing:.5px;color:var(--gold-l)}
.top .tag{font-size:14px;letter-spacing:3px;color:var(--gold);text-transform:uppercase}
.top .state{margin-left:auto;font-size:14px;color:#d9cfe3;text-align:right}

.wrap{max-width:980px;margin:0 auto;padding:22px 20px 70px}
.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:8px}
.btn{font-size:15px;padding:10px 16px;border-radius:999px;border:1px solid var(--line);background:#fff;color:var(--ink)}
.btn:hover{border-color:var(--gold)}
.btn.primary{background:var(--night);border-color:var(--night);color:var(--gold-l)}
.btn.ghost{background:transparent}
.tools .sp{flex:1}
.hint{font-size:14px;color:var(--muted);margin:6px 2px 18px}
.saved{font-size:14px;color:var(--gold-d);min-height:20px;margin:0 2px 8px}

/* การ์ดบัญชี */
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px 24px 16px;margin-bottom:18px;box-shadow:0 1px 0 #fff inset,0 6px 22px -14px #3a2449;break-inside:avoid}
.head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-bottom:14px;margin-bottom:16px;border-bottom:1px solid var(--line)}
.svc{flex:1;min-width:200px;border:none;background:transparent;font-family:TriM,serif;font-size:24px;color:var(--night);padding:2px 0;border-bottom:1px dashed transparent}
.svc:focus{outline:none;border-bottom-color:var(--gold)}
.pill{font-size:13px;padding:4px 12px;border-radius:999px;border:1px solid;white-space:nowrap}
.pill.ok{color:var(--blue);border-color:#b9cbec;background:#f3f7fd}
.pill.wait{color:#8a6a12;border-color:#e6d49a;background:#fdf9ec}

.f{margin-bottom:14px}
.f label{display:block;font-size:12.5px;letter-spacing:1.5px;color:var(--gold-d);margin-bottom:6px}
.f input,.f textarea{width:100%;font-family:Plex,sans-serif;font-size:17px;color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:10px;padding:10px 14px}
.f input:focus,.f textarea:focus{outline:none;border-color:var(--gold);background:#fff;box-shadow:0 0 0 3px #c99b3c22}
.f textarea{resize:none;overflow:hidden;min-height:48px;line-height:1.6}
.key input{font-family:var(--mono);font-size:21px;letter-spacing:1px;padding:12px 16px;background:#fff}
.key.main input{border-color:#e2cf9c}
.line{display:flex;gap:8px}.line input{flex:1;min-width:0}
.sm{font-size:14px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:#fff;color:var(--ink);white-space:nowrap}
.sm:hover{border-color:var(--gold);color:var(--gold-d)}
.row{display:grid;gap:14px}
.r3{grid-template-columns:1.6fr 1fr}
.r2{grid-template-columns:1fr 1fr}
.r3 input{font-family:var(--mono);letter-spacing:.5px}
.r3 .date input{font-family:Plex,sans-serif;letter-spacing:0}
.r3 .date{grid-column:auto}
.tf{display:flex;gap:6px}
.tf button{flex:1;font-size:14px;padding:10px 6px;border-radius:10px;border:1px solid var(--line);background:#fff;color:var(--muted)}
.tf button.on.yes{background:var(--blue);border-color:var(--blue);color:#fff}
.tf button.on.no{background:var(--orange);border-color:var(--orange);color:#fff}
details{border-top:1px solid var(--line);padding-top:10px;margin-top:2px}
summary{cursor:pointer;font-size:14px;color:var(--muted);list-style:none}
summary::before{content:"＋ ";color:var(--gold-d)}
details[open] summary::before{content:"－ "}
details .f{margin:10px 0 4px}
textarea.hide{-webkit-text-security:disc}
.codes textarea{font-family:var(--mono);font-size:18px;letter-spacing:1px}
.foot{display:flex;justify-content:flex-end;margin-top:8px}
.tabs{display:flex;gap:6px;margin-bottom:16px;border-bottom:1px solid var(--line)}
.tabs button{background:none;border:none;font-family:TriM,serif;font-size:19px;padding:10px 18px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--night);border-bottom-color:var(--gold)}
.when{font-size:13px;color:var(--muted);white-space:nowrap}
.note textarea{font-size:18px;line-height:1.85;min-height:110px;background:#fff}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.tile{text-align:left;background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 18px;display:flex;flex-direction:column;gap:6px;min-height:118px;box-shadow:0 6px 18px -14px #3a2449;transition:transform .15s,border-color .15s}
.tile:hover{border-color:var(--gold);transform:translateY(-2px)}
.tile.dragging{opacity:.35}
.tile.over{border-color:var(--gold);box-shadow:0 0 0 3px #c99b3c55}
.mv{display:flex;align-items:center;gap:8px;margin-top:8px}
.mv span{font-size:15px;padding:6px 14px;border-radius:8px;border:1px solid var(--line);background:var(--field);color:var(--night);cursor:pointer}
.mv span:hover{border-color:var(--gold)}
.mv .n{border:none;background:none;color:var(--muted);font-size:13px;padding:0 4px;cursor:default}
.mv .off{opacity:.25;pointer-events:none}
.tt{font-family:TriM,serif;font-size:19px;color:var(--night);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ts{font-family:var(--mono);font-size:14px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.note-t .ts{font-family:Plex,sans-serif;font-size:14.5px}
.dot{margin-top:auto;align-self:flex-start;font-size:12.5px;padding:2px 10px;border-radius:999px;border:1px solid}
.dot.ok{color:var(--blue);border-color:#b9cbec;background:#f3f7fd}
.dot.wait{color:#8a6a12;border-color:#e6d49a;background:#fdf9ec}
.dot.date{color:var(--muted);border-color:var(--line);background:var(--field)}
.sheet{align-items:flex-start;overflow-y:auto;padding:28px 16px}
.sheet .panel{max-width:900px;width:100%;margin:auto 0}
.sbar{display:flex;justify-content:flex-end;margin-bottom:10px}
.sbar .btn{background:#fff}
.sheet .card{margin:0;box-shadow:0 20px 60px -20px #000a}
.empty{text-align:center;color:var(--muted);padding:50px 20px;border:1px dashed var(--line);border-radius:16px;background:#fff}
.del{font-size:13px;background:none;border:none;color:var(--muted);padding:6px 4px}
.del:hover{color:var(--orange)}
#more{display:none}
@media (max-width:760px){#more{display:inline-block}.tools:not(.open) .ghost,.tools:not(.open) #sort,.tools:not(.open) #al,.tools:not(.open) #alm{display:none!important}.r3,.r2{grid-template-columns:1fr}.top .state{display:none}}

/* หน้าล็อก */
body.locked{background:radial-gradient(120% 120% at 20% 0%,var(--night-2),var(--night) 55%,var(--night-3));min-height:100vh}
.lock{max-width:440px;margin:0 auto;padding:12vh 20px 40px;text-align:center;color:#fff}
.lock img{width:92px;height:92px;margin-bottom:10px}
.lock h1{font-family:Tri;font-weight:normal;font-size:32px;margin:0;color:var(--gold-l)}
.lock .tag{font-size:13px;letter-spacing:4px;color:var(--gold);margin:6px 0 26px}
.lock p{color:#d9cfe3;font-size:15px;margin:0 0 14px}
.lock input{width:100%;margin:6px 0;text-align:center;font-family:var(--mono);font-size:22px;letter-spacing:3px;padding:14px;border-radius:12px;border:1px solid #5b4369;background:#ffffff10;color:#fff}
.lock input::placeholder{font-family:Plex,sans-serif;letter-spacing:0;color:#a897b4;font-size:16px}
.lock input:focus{outline:none;border-color:var(--gold);background:#ffffff18}
.lock .peek{background:none;border:none;color:var(--gold);font-size:14px;margin:4px 0 8px}
.lock .go{width:100%;margin-top:8px;padding:14px;border-radius:12px;border:none;background:linear-gradient(180deg,#E7C978,var(--gold) 60%,#A8802C);color:var(--night);font-family:PlexM,Plex,sans-serif;font-size:17px}
.lock .go.alt{background:none;border:1px solid var(--gold);color:var(--gold-l);margin-top:12px}
.lock .err{color:#f1a46a;min-height:24px;font-size:15px;margin-top:6px}
.lock .note{margin-top:22px;text-align:left;font-size:14px;line-height:1.7;color:#d9cfe3;border:1px solid #5b4369;border-radius:12px;padding:12px 16px;background:#ffffff08}
.lock .note b{color:var(--gold-l)}
.lock .foot2{margin-top:26px;font-size:13px;color:#a897b4}

/* หน้าต่างเล็ก */
.ov{position:fixed;inset:0;background:#120818aa;display:flex;align-items:center;justify-content:center;z-index:9;padding:16px}
.ov .box{background:#fff;border-radius:16px;padding:22px;max-width:420px;width:100%;border-top:4px solid var(--gold)}
.ov p{margin:0 0 12px;font-family:TriM,serif;font-size:19px;color:var(--night)}
.ov .acts{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}

@media print{
  body,body.locked{background:#fff}.top{background:none;color:var(--night)}.top h1{color:var(--night)}.top .state,.tools,.hint,.saved,.foot,.sm,.noprint{display:none!important}
  .card{box-shadow:none;border-color:#ccc}.f input,.f textarea{border:none;border-bottom:1px solid #ccc;border-radius:0;background:none}
  details{display:block}details>*{display:block}body:not(.printpw) .secret{display:none}
}

function store(k, v) { try { v === null ? localStorage.removeItem(k) : localStorage.setItem(k, v); return true; } catch (e) { return false; } }

// รหัสหลัก → กุญแจเข้ารหัส (PBKDF2 600,000 รอบ) · ข้อมูลเข้ารหัส AES-GCM ก่อนบันทึกทุกครั้ง
async function derive(pw, s) {
  const base = await crypto.subtle.importKey("raw", enc.encode(pw), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2", salt:s, iterations:ITER, hash:"SHA-256"}, base, {name:"AES-GCM", length:256}, false, ["encrypt","decrypt"]);
}
async function seal() {
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({name:"AES-GCM", iv}, key, enc.encode(JSON.stringify({accounts:data, notes})));
  return JSON.stringify({app:"amatathewa-vault", v:1, iter:ITER, salt:b64(salt), iv:b64(iv), ct:b64(ct)});
}
async function unseal(blob, pw) {
  const o = JSON.parse(blob), s = ub64(o.salt), k = await derive(pw, s);
  const pt = await crypto.subtle.decrypt({name:"AES-GCM", iv:ub64(o.iv)}, k, ub64(o.ct));
  return {k, s, d: JSON.parse(dec.decode(pt))};
}
// รุ่นแรกเก็บแค่รายการบัญชี (array) · รุ่นนี้เก็บ {accounts, notes}
function setData(d) {
  if (Array.isArray(d)) { data = d; notes = notes || []; }
  else { data = d.accounts || []; notes = d.notes || []; }
}

// ไฟล์สมุดที่ผูกไว้ (เช่นใน OneDrive) · ในไฟล์เป็นข้อมูลเข้ารหัสแบบเดียวกัน · เครื่องนี้จำไฟล์ไว้ใน IndexedDB

  const get = (async () => { try { const db = await idb(); return await new Promise(res => { const q = db.transaction("h").objectStore("h").get(k); q.onsuccess = () => res(q.result || null); q.onerror = () => res(null); }); } catch (e) { return null; } })();
  return Promise.race([get, new Promise(res => setTimeout(() => res(null), 1500))]);  // กันหน้าค้างถ้าเบราว์เซอร์ไม่ตอบ
}

}

}

    const f = e.target.files[0]; if (!f) return; const s = await f.text(); e.target.value = "";
    let o; try { o = JSON.parse(s); } catch (err) { msg("ไฟล์ไม่ถูกต้อง"); return; }
    if (Array.isArray(o)) { data = o; save(); render(); msg("โหลดคืนแล้ว"); return; }
    askPw("ใส่รหัสหลักของไฟล์สำรองนี้", async p => {
      try { setData((await unseal(s, p)).d); save(); render(); msg("โหลดคืนแล้ว"); } catch (err) { msg("เปิดไฟล์ไม่ได้ (รหัสไม่ถูกหรือไฟล์เสีย)"); }
    });
  };
  $("cm").onclick = () => askPw(`รหัสหลักใหม่ (อย่างน้อย ${MIN_LEN} ตัว)`, p1 => askPw("พิมพ์รหัสหลักใหม่อีกครั้ง", async p2 => {
    if (p1.length < MIN_LEN || p1 !== p2) { msg("ไม่ได้เปลี่ยน: สั้นไปหรือพิมพ์ไม่ตรงกัน"); return; }
    salt = crypto.getRandomValues(new Uint8Array(16));
    if (syncAuth) { const d = await deriveBoth(p1, salt); key = d.k; syncNew = {auth:d.auth, salt:b64(salt)}; } else key = await derive(p1, salt);
    save(); msg("เปลี่ยนรหัสหลักแล้ว · อย่าลืมจดรหัสใหม่");
  }));
  render(); updState();
}

function overlay(html) {
  const o = document.createElement("div"); o.className = "ov";
  o.innerHTML = `<div class="box">${html}</div>`; document.body.appendChild(o); return o;
}
function askPw(title, cb) {
  const o = overlay(`<p>${title}</p><div class="f key"><div class="line"><input type="password" autocomplete="off"><button class="sm">👁 ดู</button></div></div><div class="acts"><button class="btn primary">ตกลง</button><button class="btn">ยกเลิก</button></div>`);
  const [peek, ok, no] = o.querySelectorAll("button"), i = o.querySelector("input"); i.focus();
  peek.onclick = () => { i.type = i.type === "password" ? "text" : "password"; peek.textContent = i.type === "password" ? "👁 ดู" : "🙈 ซ่อน"; };
  ok.onclick = () => { const v = i.value; o.remove(); cb(v); }; no.onclick = () => o.remove();
  i.onkeydown = e => { if (e.key === "Enter") ok.click(); };
}
function confirmBox(title, a, b, cb) {
  const o = overlay(`<p>${title}</p><div class="acts"><button class="btn">${a}</button><button class="btn primary">${b}</button></div>`);
  const [y, n] = o.querySelectorAll("button"); y.onclick = () => { o.remove(); cb(true); }; n.onclick = () => { o.remove(); cb(false); };
}
async function copy(v, ok, el) {
  try { await navigator.clipboard.writeText(v); msg(ok); } catch (e) { el.type = "text"; el.select(); msg("คัดลอกอัตโนมัติไม่ได้ เลือกข้อความไว้ให้แล้ว"); }
}

function render() {
  document.querySelectorAll(".tabs button").forEach(b => b.classList.toggle("on", b.dataset.v === view));
  $("add").textContent = view === "notes" ? "＋ เพิ่มโน้ต" : "＋ เพิ่มบัญชี";
  $("sort").textContent = sortMode ? "✓ จัดลำดับเสร็จ" : "↕ จัดลำดับ";
  $("sort").classList.toggle("primary", sortMode);
  document.querySelector(".hint").textContent = sortMode
    ? "โหมดจัดลำดับ · ลากกล่องไปวางที่ใหม่ หรือกด ◀ ▶ เพื่อเลื่อนทีละช่อง · เสร็จแล้วกด ✓ จัดลำดับเสร็จ"
    : "ทุกอย่างเข้ารหัสก่อนบันทึก · ลากกล่องเพื่อสลับตำแหน่งได้ · ใช้เสร็จกดล็อกสมุดทุกครั้ง";
  if (view === "notes") return renderNotes();
  const L = $("list"); L.innerHTML = "";
  if (!data.length) { L.innerHTML = '<div class="empty">ยังไม่มีบัญชี · กด ＋ เพิ่มบัญชี เพื่อเริ่มจด</div>'; return; }
  const g = document.createElement("div"); g.className = "tiles"; L.appendChild(g);
  data.forEach((d, i) => {
    const t = document.createElement("button"); t.className = "tile";
    t.innerHTML = `<div class="tt">${esc(d.svc) || "บัญชีใหม่"}</div><div class="ts">${esc(d.user) || "ยังไม่ใส่อีเมล"}</div>
      <span class="dot ${d.tfa === "yes" ? "ok" : "wait"}">${d.tfa === "yes" ? "▲ ยืนยัน 2 ขั้นตอนแล้ว" : "● ยังไม่ยืนยัน 2 ขั้นตอน"}</span>`;
    wire(t, data, i, () => openAcc(d, i)); g.appendChild(t);
  });
}

// จัดลำดับกล่อง: ลากวาง หรือโหมดจัดลำดับกด ◀ ▶ ทีละช่อง (ไม่ต้องกดค้าง)
let dragFrom = null, sortMode = false;
function move(arr, from, to) { const [x] = arr.splice(from, 1); arr.splice(to, 0, x); }
function wire(t, arr, i, open) {
  t.draggable = true;
  t.onclick = () => { if (!sortMode) open(); };
  t.addEventListener("dragstart", e => { dragFrom = i; t.classList.add("dragging"); e.dataTransfer.effectAllowed = "move"; });
  t.addEventListener("dragend", () => { dragFrom = null; document.querySelectorAll(".tile").forEach(x => x.classList.remove("dragging", "over")); });
  t.addEventListener("dragover", e => { e.preventDefault(); if (dragFrom !== null && dragFrom !== i) t.classList.add("over"); });
  t.addEventListener("dragleave", () => t.classList.remove("over"));
  t.addEventListener("drop", e => { e.preventDefault(); if (dragFrom === null || dragFrom === i) return; move(arr, dragFrom, i); dragFrom = null; save(); render(); });
  if (sortMode) {
    const b = document.createElement("div"); b.className = "mv";
    b.innerHTML = `<span data-m="-1" class="${i === 0 ? "off" : ""}">◀</span><span class="n">ลำดับ ${i + 1}</span><span data-m="1" class="${i === arr.length - 1 ? "off" : ""}">▶</span>`;
    b.querySelectorAll("[data-m]").forEach(s => s.onclick = e => {
      e.stopPropagation(); const j = i + Number(s.dataset.m); if (j < 0 || j >= arr.length) return;
      move(arr, i, j); save(); render();
    });
    t.appendChild(b);
  }
}

// หน้าต่างใหญ่ที่เด้งขึ้นมาเมื่อกดกล่อง · ปิดแล้วกลับไปหน้ารวม
function sheet(c) {
  const o = document.createElement("div"); o.className = "ov sheet";
  o.innerHTML = '<div class="panel"><div class="sbar"><button class="btn" data-close>✕ ปิด</button></div></div>';
  o.querySelector(".panel").appendChild(c); document.body.appendChild(o);
  o.querySelector("[data-close]").onclick = closeSheet;
  o.onclick = e => { if (e.target === o) closeSheet(); };
  c.querySelectorAll("textarea").forEach(grow);
  document.body.style.overflow = "hidden";
}
function closeSheet() { document.querySelectorAll(".sheet").forEach(o => o.remove()); document.body.style.overflow = ""; if (key) render(); }

function openAcc(d, i) {
    const c = document.createElement("div"); c.className = "card";
    const st = d.tfa === "yes" ? '<span class="pill ok">▲ ยืนยัน 2 ขั้นตอนแล้ว</span>' : '<span class="pill wait">● ยังไม่ยืนยัน 2 ขั้นตอน</span>';
    c.innerHTML = `
    <div class="head"><input class="svc" data-k="svc" value="${esc(d.svc)}" placeholder="ชื่อบริการ เช่น Gmail บริษัท">${st}</div>
    <div class="f key main"><label>อีเมล / ชื่อผู้ใช้</label><div class="line"><input data-k="user" value="${esc(d.user)}" autocomplete="off"><button class="sm" data-a="copyu">คัดลอก</button></div></div>
    <div class="f key secret"><label>รหัสผ่าน</label><div class="line"><input data-k="pw" type="password" value="${esc(d.pw)}" autocomplete="off">
      <button class="sm" data-a="show">ดู</button><button class="sm" data-a="copy">คัดลอก</button></div></div>
    <div class="row r3">
      <div class="f"><label>อีเมลสำรองกู้คืน</label><input data-k="remail" value="${esc(d.remail)}"></div>
      <div class="f"><label>เบอร์โทรกู้คืน</label><input data-k="phone" value="${esc(d.phone)}" inputmode="tel"></div>
    </div>
    <div class="row r3">
      <div class="f date"><label>วันที่สมัคร</label><input data-k="date" value="${esc(d.date)}" placeholder="เช่น 28 ต.ค. 2569"></div>
      <div class="f"><label>ยืนยัน 2 ขั้นตอน</label><div class="tf"><button class="yes ${d.tfa === "yes" ? "on" : ""}" data-t="yes">▲ เปิดแล้ว</button><button class="no ${d.tfa === "no" ? "on" : ""}" data-t="no">▼ ยังไม่เปิด</button></div></div>
    </div>
    <div class="row r2">
      <div class="f"><label>ใช้ทำอะไร</label><textarea data-k="use" rows="1">${esc(d.use)}</textarea></div>
      <div class="f"><label>หมายเหตุ</label><textarea data-k="note" rows="1">${esc(d.note)}</textarea></div>
    </div>
    <details class="secret" ${d.codes ? "" : ""}><summary>รหัสสำรอง (backup codes)${d.codes ? " · มีบันทึกไว้" : ""}</summary>
      <div class="f codes"><textarea data-k="codes" class="hide" rows="2">${esc(d.codes)}</textarea></div>
      <button class="sm noprint" data-a="showc" style="padding:8px 14px">ดู / ซ่อน</button></details>
    <div class="foot"><button class="del" data-del>ลบบัญชีนี้</button></div>`;
    c.querySelectorAll("[data-k]").forEach(el => el.addEventListener("input", () => { d[el.dataset.k] = el.value; save(); if (el.tagName === "TEXTAREA") grow(el); }));
    const pw = c.querySelector('[data-k="pw"]'), us = c.querySelector('[data-k="user"]');
    c.querySelector('[data-a="copyu"]').onclick = () => copy(us.value, "คัดลอกอีเมลแล้ว", us);
    c.querySelector('[data-a="show"]').onclick = e => { pw.type = pw.type === "password" ? "text" : "password"; e.target.textContent = pw.type === "password" ? "ดู" : "ซ่อน"; };
    c.querySelector('[data-a="copy"]').onclick = () => copy(pw.value, "คัดลอกรหัสแล้ว · วางเสร็จควรคัดลอกอย่างอื่นทับ", pw);
    c.querySelector('[data-a="showc"]').onclick = () => { const t = c.querySelector('[data-k="codes"]'); t.classList.toggle("hide"); grow(t); };
    c.querySelectorAll("[data-t]").forEach(b => b.onclick = () => {
      d.tfa = b.dataset.t; save();
      c.querySelectorAll("[data-t]").forEach(x => x.classList.toggle("on", x === b));
      c.querySelector(".pill").outerHTML = d.tfa === "yes" ? '<span class="pill ok">▲ ยืนยัน 2 ขั้นตอนแล้ว</span>' : '<span class="pill wait">● ยังไม่ยืนยัน 2 ขั้นตอน</span>';
    });
    // ลบได้ต่อเมื่อใส่รหัสหลักถูก (ตรวจโดยลองถอดรหัสข้อมูลที่บันทึกไว้)
    c.querySelector("[data-del]").onclick = () => askPw(`ใส่รหัสหลักเพื่อยืนยันการลบ "${esc(d.svc) || "บัญชีนี้"}"`, async p => {
      try { await unseal(load(VKEY), p); } catch (e) { msg("รหัสหลักไม่ถูกต้อง · ยังไม่ได้ลบ"); return; }
      data.splice(i, 1); save(); closeSheet(); msg("ลบบัญชีแล้ว");
    });
    sheet(c);
}

function renderNotes() {
  const L = $("list"); L.innerHTML = "";
  if (!notes.length) { L.innerHTML = '<div class="empty">ยังไม่มีโน้ต · กด ＋ เพิ่มโน้ต เพื่อเริ่มจด</div>'; return; }
  const g = document.createElement("div"); g.className = "tiles"; L.appendChild(g);
  notes.forEach((n, i) => {
    const t = document.createElement("button"); t.className = "tile note-t";
    const first = (n.b || "").split("\n").find(s => s.trim()) || "ยังไม่มีเนื้อหา";
    t.innerHTML = `<div class="tt">${esc(n.t) || "ไม่มีหัวข้อ"}</div><div class="ts">${esc(first)}</div><span class="dot date">แก้ล่าสุด ${esc(n.u)}</span>`;
    wire(t, notes, i, () => openNote(n, i)); g.appendChild(t);
  });
}

function openNote(n, i) {
    const c = document.createElement("div"); c.className = "card note";
    c.innerHTML = `<div class="head"><input class="svc nt" data-k="t" value="${esc(n.t)}" placeholder="หัวข้อโน้ต"><span class="when">แก้ล่าสุด ${esc(n.u)}</span></div>
    <div class="f"><textarea data-k="b" rows="3" placeholder="เขียนได้ยาวตามต้องการ หรือจดสั้นๆ ก็ได้">${esc(n.b)}</textarea></div>
    <div class="foot"><button class="del" data-del>ลบโน้ตนี้</button></div>`;
    c.querySelectorAll("[data-k]").forEach(el => el.addEventListener("input", () => {
      n[el.dataset.k] = el.value; n.u = today(); c.querySelector(".when").textContent = "แก้ล่าสุด " + n.u; save();
      if (el.tagName === "TEXTAREA") grow(el);
    }));
    c.querySelector("[data-del]").onclick = () => askPw(`ใส่รหัสหลักเพื่อยืนยันการลบโน้ต "${esc(n.t) || "ไม่มีหัวข้อ"}"`, async p => {
      try { await unseal(load(VKEY), p); } catch (e) { msg("รหัสหลักไม่ถูกต้อง · ยังไม่ได้ลบ"); return; }
      notes.splice(i, 1); save(); closeSheet(); msg("ลบโน้ตแล้ว");
    });
    sheet(c);
}

if (!window.crypto || !crypto.subtle) $("app").innerHTML = '<div class="wrap">เบราว์เซอร์นี้เข้ารหัสไม่ได้ กรุณาเปิดไฟล์ด้วย Chrome</div>';
else showLock();
</script></body></html>
