<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>Squad English</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kanit:wght@500;700;800&family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap">
<style>
/* Layout: comic-panel game HUD — one stage panel (character + speech balloon) with a step rail above, lesson select as a squad roster */
:root{
  --ink:#10131c; --panel:#1a1f2e; --panel2:#232a3d; --line:#05070c;
  --paper:#f4efe4; --muted:#a9b0c4;
  --gold:#ffc93c; --mint:#5fe0a6; --red:#ff5a4e; --sky:#62b6ff;
  --ok:#5fe0a6; --bad:#ff5a4e;
  --display:"Kanit","Leelawadee UI","Tahoma",sans-serif;
  --body:"IBM Plex Sans Thai","Leelawadee UI","Tahoma",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--ink);color:var(--paper)}
body{font-family:var(--body);font-size:16px;line-height:1.6;margin:0;
  background-image:radial-gradient(rgba(255,255,255,.045) 1px,transparent 1.4px);background-size:9px 9px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 40px}
.wrap{max-width:1080px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--display);line-height:1.15;text-wrap:balance;margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,.card:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.btn{background:var(--gold);color:var(--line);border:3px solid var(--line);box-shadow:4px 4px 0 var(--line);
  font-family:var(--display);font-weight:700;padding:8px 18px;border-radius:6px;transition:transform .08s}
.btn:active{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--line)}
.btn.ghost{background:var(--panel2);color:var(--paper)}
.btn[disabled]{opacity:.4;cursor:default}

/* top bar */
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:space-between}
.brand{display:flex;align-items:baseline;gap:10px}
.brand h1{font-size:clamp(26px,5vw,38px);font-weight:800;letter-spacing:.5px;
  color:var(--gold);text-shadow:3px 3px 0 var(--line)}
.brand span{color:var(--muted);font-size:14px}
.modes{display:flex;border:3px solid var(--line);border-radius:8px;overflow:hidden;box-shadow:3px 3px 0 var(--line)}
.modes button{background:var(--panel2);border:0;padding:6px 12px;font-family:var(--display);font-weight:500;font-size:14px}
.modes button[aria-pressed="true"]{background:var(--mint);color:var(--line)}

/* home */
.hero{display:grid;grid-template-columns:1.1fr 1fr;gap:18px;align-items:end;background:var(--panel);
  border:3px solid var(--line);border-radius:10px;box-shadow:6px 6px 0 var(--line);padding:18px 18px 0;overflow:hidden}
.hero .txt{padding-bottom:18px;display:flex;flex-direction:column;gap:10px;min-width:0}
.hero h2{font-size:clamp(24px,4vw,34px)}
.rank{display:inline-flex;gap:8px;align-items:center;font-family:var(--display);font-weight:700;
  background:var(--line);padding:4px 12px;border-radius:999px;width:fit-content;font-size:14px;letter-spacing:.5px}
.rank i{width:12px;height:12px;border-radius:50%;background:var(--rk,#c98a4b);display:inline-block}
.bar{height:12px;background:var(--line);border-radius:6px;overflow:hidden}
.bar b{display:block;height:100%;background:linear-gradient(90deg,var(--mint),var(--gold));width:0}
.squad{display:flex;justify-content:center;align-items:flex-end;height:260px}
.squad img{height:100%;width:auto;max-width:34%;object-fit:contain;object-position:bottom;margin:0 -14px;filter:drop-shadow(3px 0 0 var(--line))}
.squad img:nth-child(2){height:112%}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.card{background:var(--panel);border:3px solid var(--line);border-radius:10px;box-shadow:4px 4px 0 var(--line);
  padding:14px;text-align:left;display:flex;flex-direction:column;gap:6px;min-width:0;position:relative}
.card:hover{background:var(--panel2)}
.card .no{font-family:var(--display);font-weight:800;font-size:13px;letter-spacing:1.5px;color:var(--gold)}
.card h3{font-size:19px}
.card p{margin:0;color:var(--muted);font-size:14px}
.card .st{font-size:13px;font-family:var(--display);color:var(--muted)}
.card.done{border-color:var(--line)} .card.done .st{color:var(--ok)}
.card.boss{background:linear-gradient(135deg,#3a2a10,#1a1f2e 60%);grid-column:1/-1}
.card.boss .no{color:var(--red)}
.note{color:var(--muted);font-size:13px}

/* lesson */
.lhead{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.lhead h2{font-size:clamp(20px,3.4vw,28px);flex:1;min-width:0}
.steps{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.steps button{flex:none;background:var(--panel2);border:2px solid var(--line);border-radius:999px;padding:4px 12px;font-size:13px;font-family:var(--display);color:var(--muted)}
.steps button[aria-current="step"]{background:var(--gold);color:var(--line)}
.steps button.seen{color:var(--paper)}
.stage{display:grid;grid-template-columns:minmax(180px,300px) 1fr;gap:0;background:var(--panel);border:3px solid var(--line);
  border-radius:10px;box-shadow:6px 6px 0 var(--line);min-height:430px;overflow:hidden;position:relative}
.stage .who{position:relative;display:flex;align-items:flex-end;justify-content:center;background:
  radial-gradient(circle at 50% 70%,var(--glow,rgba(95,224,166,.25)),transparent 65%)}
.stage .who img{width:100%;height:auto;max-height:430px;object-fit:contain;object-position:bottom;display:block}
.stage .name{position:absolute;left:10px;top:10px;font-family:var(--display);font-weight:700;background:var(--line);padding:2px 10px;border-radius:4px;font-size:14px}
.stage .body{padding:20px;display:flex;flex-direction:column;gap:14px;min-width:0}
.balloon{background:var(--paper);color:var(--line);border:3px solid var(--line);border-radius:14px;padding:16px 18px;
  font-size:18px;line-height:1.65;position:relative;box-shadow:4px 4px 0 var(--line)}
.balloon:before{content:"";position:absolute;left:-16px;top:28px;border:8px solid transparent;border-right:12px solid var(--line)}
.balloon .en{font-family:var(--display);font-weight:500;font-size:21px}
.balloon .sub{color:#4b5266;font-size:15px;margin-top:6px}
.balloon.you{background:var(--gold)}
.ctrl{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.ctrl .sp{flex:1}
.count{font-family:var(--display);color:var(--muted);font-size:14px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{background:var(--panel2);border:2px solid var(--line);border-radius:999px;padding:3px 12px;font-size:14px}
.chip[aria-pressed="true"]{background:var(--sky);color:var(--line)}

/* vocab */
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.flip{background:var(--paper);color:var(--line);border:3px solid var(--line);border-radius:10px;box-shadow:3px 3px 0 var(--line);
  min-height:118px;padding:10px;text-align:left;display:flex;flex-direction:column;gap:4px;justify-content:center}
.flip .w{font-family:var(--display);font-weight:700;font-size:20px}
.flip .t{font-size:15px}
.flip .x{font-size:13px;color:#4b5266}
.flip.back{background:var(--mint)}

/* quiz */
.q{display:flex;flex-direction:column;gap:12px}
.q .qt{font-family:var(--display);font-size:22px;font-weight:500}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
.opt{background:var(--panel2);border:3px solid var(--line);border-radius:8px;padding:10px 14px;text-align:left;font-size:17px;box-shadow:3px 3px 0 var(--line)}
.opt.ok{background:var(--ok);color:var(--line)} .opt.no{background:var(--bad);color:var(--line)}
.tray{min-height:52px;background:var(--line);border-radius:8px;padding:8px;display:flex;gap:8px;flex-wrap:wrap}
.word{background:var(--paper);color:var(--line);border:2px solid var(--line);border-radius:6px;padding:4px 12px;font-family:var(--display);font-size:18px}
.fb{border-radius:8px;padding:10px 14px;font-size:15px}
.fb.ok{background:rgba(95,224,166,.15);border:2px solid var(--ok)} .fb.no{background:rgba(255,90,78,.15);border:2px solid var(--bad)}
.score{font-family:var(--display);font-size:clamp(40px,8vw,64px);font-weight:800;color:var(--gold);text-shadow:3px 3px 0 var(--line)}
.from{font-size:12px;color:var(--muted)}

@media (max-width:720px){
  .hero{grid-template-columns:1fr}
  .squad{height:200px}
  .stage{grid-template-columns:1fr;min-height:0}
  .stage .who{height:230px;overflow:hidden;align-items:flex-start}
  .stage .who img{max-height:none;width:auto;height:330px;object-position:top}
  .balloon:before{left:30px;top:-18px;border:9px solid transparent;border-bottom:12px solid var(--line)}
  .balloon{font-size:17px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="wrap" id="app"></div>

<style>
#gate{min-height:80vh;display:grid;place-items:center}
#gate .card{width:min(420px,100%);background:var(--panel);border:3px solid var(--line);border-radius:18px;padding:28px 22px;box-shadow:6px 6px 0 var(--line);text-align:center}
#gate h1{font-family:var(--display);font-size:30px;color:var(--gold);margin-bottom:6px}
#gate p{color:var(--muted);margin:0 0 18px}
#gate input{width:100%;font:600 22px var(--display);letter-spacing:.12em;text-align:center;text-transform:uppercase;padding:12px;border-radius:12px;border:3px solid var(--line);background:var(--paper);color:var(--ink)}
#gate button{margin-top:14px;width:100%;font:700 18px var(--display);padding:12px;border-radius:12px;border:3px solid var(--line);background:var(--gold);color:var(--ink);cursor:pointer;box-shadow:3px 3px 0 var(--line)}
#gate button:disabled{opacity:.6;cursor:wait}
#gmsg{min-height:1.6em;margin-top:12px;color:var(--red);font-weight:600}
#who{max-width:1080px;margin:28px auto 0;text-align:center;color:var(--muted);font-size:14px}
#who button{background:none;border:0;color:var(--sky);font:inherit;text-decoration:underline;cursor:pointer;padding:4px}
</style>

</form></div>

const $=id=>document.getElementById(id), ub=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const ls={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}}};
const msg=t=>$("gmsg").textContent=t;
async function enter(code){
  $("gbtn").disabled=true;msg("");$("gbtn").textContent="กำลังเข้า…";
  try{
    let r;try{r=await fetch(API+"/eng/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({code})})}
    catch(e){throw new Error("เชื่อมต่อไม่ได้ ลองเช็กอินเทอร์เน็ตแล้วกดใหม่")}
    const j=await r.json().catch(()=>({}));
    if(!r.ok){if(r.status===401)ls.set("sqe_code",null);throw new Error(j.message||"เข้าไม่ได้ ลองใหม่อีกครั้ง")}
    const key=await crypto.subtle.importKey("raw",ub(j.key),"AES-GCM",false,["decrypt"]);
    const js=new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:ub(BLOB.iv)},key,ub(BLOB.ct)));
    ls.set("sqe_code",code);
    start(code,j,js);
  }catch(e){msg(e.message||"เปิดบทเรียนไม่ได้");$("gbtn").disabled=false;$("gbtn").textContent="เข้าเรียน"}
}
function start(code,j,js){
  let t=null,dirty=false;
  const push=()=>{clearTimeout(t);if(!dirty)return;dirty=false;const s=R.state;
    fetch(API+"/eng/save",{method:"POST",keepalive:true,headers:{"Content-Type":"application/json"},body:JSON.stringify({code,state:{prog:s.prog,big:s.big,mode:s.mode}})}).catch(()=>{dirty=true;t=setTimeout(push,15000)})};
  const R=window.SQE_REMOTE={state:j.state,save(){dirty=true;clearTimeout(t);t=setTimeout(push,1200)}};
  addEventListener("visibilitychange",()=>{if(document.visibilityState==="hidden")push()});
  addEventListener("pagehide",push);
  $("gate").remove();
  const w=document.createElement("div");w.id="who";
  w.innerHTML=`เรียนในชื่อ <b></b> · ความคืบหน้าบันทึกอัตโนมัติ เปิดเครื่องไหนก็เรียนต่อได้ · <button type="button">ออกจากระบบ</button>`;
  w.querySelector("b").textContent=j.name;
  w.querySelector("button").onclick=()=>{push();ls.set("sqe_code",null);location.hash="";location.reload()};
  document.body.appendChild(w);
  const s=document.createElement("script");s.textContent=js;document.body.appendChild(s);
}
document.querySelector("#gate form").onsubmit=e=>{e.preventDefault();const c=$("gcode").value.trim();if(c.replace(/[^a-z0-9]/gi,"").length<6){msg("ใส่รหัส 8 ตัวที่ได้รับ");return}enter(c)};
const saved=ls.get("sqe_code");if(saved){$("gcode").value=saved;enter(saved)}else $("gcode").focus();
})();
</script>
